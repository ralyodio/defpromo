name: Check CoinPay integration

on:
  pull_request:
    paths:
      - '.github/coinpay.yml'
      - '.github/workflows/coinpay*.yml'
      - 'scripts/check-coinpay-workflow.mjs'
  push:
    branches: [master]
    paths:
      - '.github/coinpay.yml'
      - '.github/workflows/coinpay*.yml'
      - 'scripts/check-coinpay-workflow.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node --test scripts/check-coinpay-workflow.mjs
